# Copiar como config/cita.yaml (fuera de git) y completar con tus datos reales.
provincia: Madrid          # tal como aparece en la lista de provincias
oficina: "99"            # "99" = cualquier oficina
tramite_policia: true    # true = lista "Trámites Policía Nacional"
tramite: "POLICÍA-TOMA DE HUELLAS"   # basta con el inicio del nombre del trámite
headless: true           # modo fantasma: sin ventana (false = ventana real)
pausa_bloqueo_min: 15    # si el sitio rechaza el acceso, esperar estos minutos antes de reintentar
ventana_oculta: true     # solo con headless: false: abre la ventana fuera de la pantalla

# Ritmo (launchd lanza el agente cada 2 min y el agente decide si toca revisar)
intervalo_min: [8, 12]          # minutos entre revisiones, al azar dentro del rango
intervalo_intenso_min: [2, 4]   # en horas intensas: las que aprende (aparecieron citas) + las de abajo
horas_intensas: []              # opcional, ej. [8, 9, 14]; más seguido = más riesgo de bloqueo
reintentos: 2                   # si un recorrido falla antes de Confirmar, se repite hasta N veces
espera_reintento_s: 15          # espera antes del 1.er reintento (se duplica); con citas a la vista, 0

# Datos del solicitante. Con Cl@ve el NIE y el nombre suelen venir rellenados.
nie: ""
nombre: ""
pais: ""                 # tal como aparece en la lista del sitio, en mayúsculas
telefono: ""             # móvil español, sin +34
email: ""

# Certificado exportado desde Acceso a Llaveros (.p12). Su contraseña va en .env: CITA_CERT_PASSWORD
certificado:
  archivo: data/cita/certificado.p12
  origenes:              # servidores de Cl@ve que piden el certificado (el log los muestra)
    - https://pasarela-ident.clave.gob.es
