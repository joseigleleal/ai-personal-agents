# Copiar como config/cita.yaml (fuera de git) y completar con tus datos reales.
provincia: Madrid          # tal como aparece en la lista de provincias
oficina: "99"            # "99" = cualquier oficina
tramite_policia: true    # true = lista "Trámites Policía Nacional"
tramite: "POLICÍA-TOMA DE HUELLAS"   # basta con el inicio del nombre del trámite
headless: true           # modo fantasma: sin ventana (false = ventana real)
pausa_bloqueo_min: 5     # si el sitio rechaza el acceso, esperar estos minutos antes de reintentar
pausa_error_min: 5       # un tipo de error que ya salió 3 veces seguidas: pausar esto en vez de reintentar
ventana_oculta: true     # solo con headless: false: abre la ventana fuera de la pantalla

# Ritmo (launchd lanza el agente cada 1 min y el agente decide si toca revisar). El ritmo se aprende:
# cada revisión sin problemas lo acorta `baja_s`, hasta `minimo_s`. Errores y bloqueos no lo cambian hasta que
# confirmes por Telegram que fue un bloqueo: entonces pausa y el ritmo del bloqueo × `sube_bloqueo` queda como piso
# durante `dias_piso` días. Otro bloqueo en el piso lo sube otro escalón, hasta que el sitio deje de bloquear.
# Ver con: python -m agents.cita.run --aprendizaje
ritmo:
  minimo_s: 60                  # nunca más seguido que esto
  maximo_s: 1800                # nunca más espaciado que esto
  inicial_s: 600                # punto de partida, sin nada aprendido
  baja_s: 30                    # cuánto se acorta tras cada revisión sin problemas
  sube_bloqueo: 1.2             # cuánto sube el ritmo (y el piso) tras un bloqueo confirmado
  dias_piso: 7                  # días que se recuerda el piso de un bloqueo (0 = no frena: solo pausa)
  horas_baja_piso: 2            # cada N horas sin bloqueos el piso baja un poco (0 = no baja)
  baja_piso_s: 12               # cuánto baja el piso cada vez (12 s: 3,0 → 2,8 → 2,6 min…)
aviso_sin_citas_min: 30         # el ⏳ "sin citas" sale como mucho cada N min (0 = en cada revisión)
horas_intensas: []              # opcional, ej. [8, 9, 14]: al doble de ritmo (además de las aprendidas)
reintentos: 2                   # si un recorrido falla antes de Confirmar, se repite hasta N veces
espera_reintento_s: 15          # espera antes del 1.er reintento (se duplica); con citas a la vista, 0
espera_dato_min: 4              # si el formulario pide un dato que no está aquí, te lo pregunta por Telegram y espera esto
historial_dias: 14              # capturas de cada revisión en data/cita/historial/ (se piden con /ver por Telegram)

# Datos del solicitante. Con Cl@ve el NIE y el nombre suelen venir rellenados.
nie: ""
nombre: ""
pais: ""                 # tal como aparece en la lista del sitio, en mayúsculas
telefono: ""             # móvil español, sin +34
email: ""

# Certificado exportado desde Acceso a Llaveros (.p12). Su contraseña va en .env: CITA_CERT_PASSWORD
certificado:
  archivo: data/cita/certificado.p12
  origenes:              # servidores de Cl@ve que piden el certificado (el log los muestra)
    - https://pasarela-ident.clave.gob.es
