# Copiar como config/vigia.yaml (fuera de git) y ajustar. El vigía audita a los demás agentes y avisa solo si algo
# anda mal (con sonido, una vez por problema); cuando se arregla, "resuelto" en silencio.
nombre: principal           # con varias VMs, cada mensaje dice de cuál viene (por defecto: el hostname)
parte_diario_hora: 9      # parte de todos los agentes, una vez al día y sin sonido (vacío = no)
tablero: true             # un mensaje que se edita en cada vuelta (agentes, CPU, RAM, disco), sin sonido

agentes:
  cita:
    tipo: cita                         # chequeos propios: lee su memoria (próxima revisión, errores, pausa)
    servicio: agentic-cita             # systemd: si el timer está apagado se da por detenido a propósito
    memoria: data/cita/aprendizaje.json
    atraso_max_min: 15                 # tenía que revisar a las X y pasaron más de N min sin hacerlo
    pausa_max_min: 90                  # una pausa más larga que esto se avisa
    max_errores_pct: 50                # % de revisiones con error o bloqueo en la última hora
    min_revisiones: 4                  # con menos revisiones en la hora no se juzga el %
  empleo:
    servicio: agentic-empleo
    log: data/empleo.log               # agentes por corridas: el log tiene que crecer
    log_max_min: 180                   # corre cada 2 h: 3 h sin escribir es un problema
    frases_error: ["No se pudo puntuar", "Traceback"]
    max_frases_error: 3
  # etiquetado:                      # proceso largo sin timer (systemd-run con un bucle)
  #   servicio: lora-etiquetar
  #   continuo: true                 # si deja de estar activo, avisa (terminó o se cayó)
  #   log: data/lora/etiquetar.log
  #   log_max_min: 60
  #   frases_error: ["Traceback"]
  #   max_frases_error: 1

sistema:
  disco_max_pct: 85
  carga_max_por_nucleo: 1.5          # carga media de 15 min por núcleo; un pico corto no cuenta
  procesos_top: 3                    # procesos que más CPU usan, en el tablero
  ram_min_libre_pct: 10
  servicios: [ollama]                  # servicios de systemd que deben estar activos
  nombres:                             # cómo se muestran los procesos (por patrón del comando)
    - {patron: llama-server, nombre: "Ollama (modelo de lenguaje)"}
    - {patron: ollama, nombre: Ollama}
    - {patron: agents.cita, nombre: "agente cita"}
    - {patron: chrome, nombre: "navegador de cita"}
    - {patron: headless_shell, nombre: "navegador de cita"}
    - {patron: agents.empleo, nombre: "agente empleo"}
    - {patron: lora_mlx.evaluar, nombre: "evaluación LoRA"}
    - {patron: lora_mlx.dataset, nombre: "etiquetado LoRA"}

# Picos (solo en UNA VM por bot: los botones se leen con getUpdates y dos lectores se pisan): avisa qué los genera y ofrece botones para detener cosas. SOLO las acciones de esta lista: desde
# Telegram nunca se ejecuta otra cosa. Tipos: descargar_ollama · detener_proceso (patron) · pausar_cita (minutos).
picos:
  cpu_pct: 90                          # muestra de CPU de 2 s...
  carga_1min_por_nucleo: 1.0           # ...y carga de 1 min alta (no un instante)
  ram_libre_pct: 15                    # o poca RAM libre
  vueltas_para_cerrar: 2               # vueltas normales seguidas para dar el pico por terminado
  acciones:
    ollama: {texto: "🧠 Descargar modelos de Ollama", tipo: descargar_ollama}
    evaluacion: {texto: "⏹️ Detener la evaluación LoRA", tipo: detener_proceso, patron: "experimentos.lora_mlx.evaluar"}
    etiquetado: {texto: "⏹️ Detener esta tanda de etiquetado", tipo: detener_proceso, patron: "experimentos.lora_mlx.dataset"}
    cita: {texto: "⏸️ Pausar cita 1 h", tipo: pausar_cita, minutos: 60}
