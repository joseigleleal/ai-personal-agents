# Perfil de EJEMPLO. Copia este archivo como config/profile.yaml y complétalo con tus datos:
#   cp config/profile.example.yaml config/profile.yaml
# Los agentes usan profile.yaml si existe; si no, este.
nombre: "Alex"
titulo: "AI Engineer & Python Developer | AI Agents, Automation, Backend & Cloud"
idiomas: ["es", "en"]
anios_experiencia: 5

